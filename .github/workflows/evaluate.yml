name: Evaluate (paper only, 24/7)
# GitHub cron: 5-minute minimum, UTC, runs can be delayed by several minutes. Crypto never closes, so no market-hours gate.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: cryptoai-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: pip install -r requirements-core.txt
      - run: bash scripts/prepare_state.sh
      - name: Evaluate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m cryptoai.runner evaluate
      - name: Publish state
        if: always()
        run: bash scripts/publish_state.sh
