name: Research and ingest
# Run this ONCE by hand first (it downloads 2 years of candles and builds the reports). It then re-runs daily.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to download"
        default: "730"
concurrency:
  group: cryptoai-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: pip install -r requirements-core.txt
      - run: bash scripts/prepare_state.sh
      - name: Download candles
        run: python -m cryptoai.runner ingest --days ${{ inputs.days || '730' }}
      - name: Backtest
        run: python -m cryptoai.runner backtest --days ${{ inputs.days || '730' }}
      - name: Publish state
        if: always()
        run: bash scripts/publish_state.sh
