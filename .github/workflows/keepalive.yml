name: Keep scheduled jobs alive
# GitHub pauses scheduled workflows in a repo that has had no activity for 60 days. Once a week this job:
#   1) switches the scheduled workflows back on if GitHub paused them (harmless if they are already on), and
#   2) if the newest commit on the main branch is older than 20 days, adds one empty "keepalive" commit so the repo counts as active.
# Limit: if the repo was ALREADY paused (for example after a 60-day break), this job is paused too. Then click "Enable workflow" by hand once.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Switch scheduled workflows back on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in evaluate.yml research.yml; do
            gh workflow enable "$wf" || echo "could not enable $wf (ignored)"
          done
      - name: Count as repo activity if quiet for 20+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Newest commit on main is $age_days days old"
          if [ "$age_days" -ge 20 ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: repo activity"
            git push || echo "push failed (ignored)"
          fi
